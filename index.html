<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="manifest" href="/manifest.json">
        <meta name="theme-color" content="#1e1e2e">
        <link rel="icon" href="https://raw.githubusercontent.com/gamedevCloudy/gamedevCloudy.github.io/main/favicon.ico" type="image/x-icon">
        <link href="https://fonts.googleapis.com/css2?family=Akshar&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
        <title>aayush's portfolio</title>
        <style>
            * {
                box-sizing: border-box;
            }
            body {
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
                height: auto;
                color: #cdd6f4;
                background-color: #1e1e2e;
                font-family: 'Montserrat', monospace, sans-serif;
                flex-direction: column;
            }

            [lang="hi"] {
                font-family: 'Akshar', sans-serif;
            }

            footer {
                position: fixed;
                bottom: 0;
                padding: 1.5rem 1.5rem;
                margin: 0 4px;
                background-color: #181825;
                color: #cdd6f4;
                width: 100%;
            }
            a {
                color: #89b4fa;
            }
            .hero {
                height: 100vh;
                padding: 5vh 0 0 0;
                flex-direction: column;
            }
            .flex {
                display: flex;
            }
            .center {
                align-items: center;
                justify-content: center;
            }
            .spread {
                align-items: stretch;
                justify-content: space-around;
                flex-wrap: wrap;
            }
            .y {
                flex-direction: column;
            }

            .projects > div > div,
            .stack > div > div {
                border: 2px solid #313244;
                margin: 2rem 2rem;
                padding: 2rem 2rem;
                flex: 1;
                min-width: 250px;
                max-width: 350px;
            }

            .projects > div > div {
                aspect-ratio: 1 / 1;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
            }
            .projects {
                margin: 0 10% 4rem;
            }
            .stack {
                margin: 0 10% 4rem;
            }

            .tags {
                flex-wrap: wrap;
                gap: 0.5rem;
            }

            .tags > div {
                border-radius: 20px;
                background-color: #a6e3a133;
                border: 2px solid #a6e3a1;
                color: #a6e3a1;
                padding: 6px 14px;
                margin: 0;
                white-space: nowrap;
                font-size: 0.85rem;
            }

            blockquote {
                background-color: #313244;
                border-left: 4px solid #89b4fa;
                padding: 1rem 1.5rem;
                margin: 1.5rem 0;
                font-style: italic;
                color: #cdd6f4;
            }

            .marquee-container {
                overflow: hidden;
                white-space: nowrap;
                width: 100%;
            }
            .marquee {
                display: inline-block;
                animation: marquee 15s linear infinite;
            }
            .marquee span {
                display: inline-block;
                padding: 0 50vw;
            }
            @keyframes marquee {
                0% {
                    transform: translateX(0);
                }
                100% {
                    transform: translateX(-50%);
                }
            }

            ::-webkit-scrollbar {
                width: 12px;
            }
            ::-webkit-scrollbar-track {
                background: #181825;
            }
            ::-webkit-scrollbar-thumb {
                background: #45475a;
                border-radius: 6px;
                border: 3px solid #181825;
            }
            ::-webkit-scrollbar-thumb:hover {
                background: #585b70;
            }

            * {
                scrollbar-width: thin;
                scrollbar-color: #45475a #181825;
            }

            @media (max-width: 768px) {
                .projects,
                .stack {
                    margin: 0 1rem 2rem;
                }

                .projects > div,
                .stack > div {
                    flex-direction: column;
                }

                .projects > div > div,
                .stack > div > div {
                    margin: 1rem 0;
                    padding: 1rem;
                    max-width: 100%;
                }

                .projects > div > div {
                    aspect-ratio: 1 / 1;
                }
            }
        </style>
    </head>
    <body class="flex center y">
        <div class="marquee-container">
            <div class="marquee">
                <span>*| for hire |*</span>
                <span>*| for hire |*</span>
            </div>
        </div>
        <div class="hero flex center"></div>

        <div class="projects" id="projects">
            <h3>projects</h3>
            <div class="flex spread"></div>
        </div>

        <div class="stack" id="stack">
            <h3>Tech Stack</h3>
            <div class="flex spread"></div>
        </div>
    </body>

    <footer class="flex center"></footer>
    <script src="data-loader.js"></script>
    <script src="script.js"></script>
</html>
